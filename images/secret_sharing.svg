<svg xmlns="http://www.w3.org/2000/svg" width="730" height="498" viewBox="0 0 730 498" role="img" aria-labelledby="title desc">
  <title id="title">Noisy side-channel leakage from a masked secret-sharing implementation</title>
  <desc id="desc">A secret is split into masked shares. An adversary observes a noisy leakage signal from each share rather than the shares themselves.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#463f3a" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#527aa3"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a4553f"/></marker>
  </defs>
  <rect width="730" height="498" rx="18" fill="#fbfaf6"/>

  <g filter="url(#shadow)">
    <circle cx="90" cy="248" r="55" fill="#fff" stroke="#d9d4ca" stroke-width="2"/>
    <rect x="177" y="198" width="116" height="100" rx="18" fill="#fff" stroke="#d9d4ca" stroke-width="2"/>
  </g>
  <text x="90" y="237" text-anchor="middle" fill="#8a817c" font-family="Inter,Arial,sans-serif" font-size="14">SECRET</text>
  <text x="90" y="271" text-anchor="middle" fill="#463f3a" font-family="Georgia,serif" font-size="38" font-style="italic">s</text>
  <path d="M145 248h27" stroke="#527aa3" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <g transform="translate(213 224)" fill="none" stroke="#527aa3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 18h44v34H0z" fill="#eef3f6"/>
    <path d="M7 18V8c0-19 30-19 30 0v10"/>
  </g>
  <text x="235" y="281" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">mask &amp; split</text>

  <text x="395" y="66" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650">masked shares</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650">
    <rect x="335" y="91" width="120" height="58" rx="12" fill="#e9f0f4" stroke="#527aa3" stroke-width="2"/>
    <rect x="335" y="177" width="120" height="58" rx="12" fill="#edf2ec" stroke="#5c8a72" stroke-width="2"/>
    <rect x="335" y="263" width="120" height="58" rx="12" fill="#f7ecd4" stroke="#c28a2c" stroke-width="2"/>
    <rect x="335" y="349" width="120" height="58" rx="12" fill="#eee9f2" stroke="#7a6987" stroke-width="2"/>
    <text x="395" y="127" text-anchor="middle" fill="#527aa3">share x₁</text>
    <text x="395" y="213" text-anchor="middle" fill="#5c8a72">share x₂</text>
    <text x="395" y="299" text-anchor="middle" fill="#a87320">share x₃</text>
    <text x="395" y="385" text-anchor="middle" fill="#7a6987">share xₙ</text>
  </g>
  <g stroke="#527aa3" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)">
    <path d="M293 248C315 220 311 120 330 120"/>
    <path d="M293 248C312 238 312 206 330 206"/>
    <path d="M293 248C312 258 312 292 330 292"/>
    <path d="M293 248C315 278 311 378 330 378"/>
  </g>

  <text x="555" y="66" text-anchor="middle" fill="#a4553f" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650">noisy leakage</text>
  <g fill="none" stroke="#a4553f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-red)">
    <path d="M462 120c18-25 33 25 51 0s33 25 51 0"/>
    <path d="M462 206c18-25 33 25 51 0s33 25 51 0"/>
    <path d="M462 292c18-25 33 25 51 0s33 25 51 0"/>
    <path d="M462 378c18-25 33 25 51 0s33 25 51 0"/>
  </g>
  <g transform="translate(636 248)" fill="none" stroke="#463f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-48 0c15-22 31-32 48-32s33 10 48 32c-15 22-31 32-48 32S-33 22-48 0Z" fill="#fff"/>
    <circle cx="0" cy="0" r="12" fill="#f4ddd7" stroke="#a4553f"/>
    <circle cx="0" cy="0" r="4" fill="#a4553f" stroke="none"/>
  </g>
  <text x="636" y="306" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="650">adversary</text>
  <text x="636" y="328" text-anchor="middle" fill="#8a817c" font-family="Inter,Arial,sans-serif" font-size="13">partial observations</text>
  <path d="M315 444h320" stroke="#ded9cf"/>
  <text x="475" y="469" text-anchor="middle" fill="#8a817c" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="1">FORMAL SECURITY UNDER GENERAL LEAKAGE</text>
</svg>
