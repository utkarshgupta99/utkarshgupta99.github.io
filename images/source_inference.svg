<svg xmlns="http://www.w3.org/2000/svg" width="730" height="498" viewBox="0 0 730 498" role="img" aria-labelledby="title desc">
  <title id="title">Source inference attack on a shuffled federated learning system</title>
  <desc id="desc">Client-specific shadow data is passed through the shared global model to train a source classifier on output fingerprints. A target record is then attributed to a client.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#463f3a" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#738ca3"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a4553f"/></marker>
  </defs>
  <rect width="730" height="498" rx="18" fill="#fbfaf6"/>

  <text x="112" y="49" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650">client shadow data</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="35" y="72" width="154" height="68" rx="12" fill="#fff" stroke="#527aa3" stroke-width="2"/>
    <rect x="35" y="157" width="154" height="68" rx="12" fill="#fff" stroke="#5c8a72" stroke-width="2"/>
    <rect x="35" y="242" width="154" height="68" rx="12" fill="#fff" stroke="#c28a2c" stroke-width="2"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650">
    <circle cx="62" cy="106" r="13" fill="#dce8ef" stroke="#527aa3" stroke-width="2"/><text x="62" y="111" text-anchor="middle" fill="#527aa3">1</text>
    <circle cx="62" cy="191" r="13" fill="#e2ece4" stroke="#5c8a72" stroke-width="2"/><text x="62" y="196" text-anchor="middle" fill="#5c8a72">2</text>
    <circle cx="62" cy="276" r="13" fill="#f7ecd4" stroke="#c28a2c" stroke-width="2"/><text x="62" y="281" text-anchor="middle" fill="#a87320">3</text>
    <text x="88" y="111" fill="#463f3a">client 1</text><text x="88" y="196" fill="#463f3a">client 2</text><text x="88" y="281" fill="#463f3a">client 3</text>
  </g>
  <g fill="none" stroke="#738ca3" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M190 106C225 106 232 145 263 164"/>
    <path d="M190 191h69"/>
    <path d="M190 276C225 276 232 237 263 218"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="130" width="150" height="120" rx="18" fill="#fff" stroke="#d9d4ca" stroke-width="2"/>
  </g>
  <g transform="translate(315 177)" fill="none" stroke="#527aa3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="9" fill="#dce8ef"/>
    <circle cx="42" cy="-22" r="9" fill="#dce8ef"/>
    <circle cx="42" cy="22" r="9" fill="#dce8ef"/>
    <path d="M9-2l24-16M9 2l24 16M51-22l22 16M51 22L73 6"/>
    <circle cx="82" cy="0" r="9" fill="#dce8ef"/>
  </g>
  <text x="345" y="224" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="650">shared global model</text>
  <text x="345" y="276" text-anchor="middle" fill="#8a817c" font-family="Inter,Arial,sans-serif" font-size="13">unchanged by model shuffling</text>

  <path d="M421 190h49" fill="none" stroke="#738ca3" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="477" y="126" width="92" height="128" rx="14" fill="#fff" stroke="#d9d4ca" stroke-width="2"/>
  </g>
  <text x="523" y="151" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">logits</text>
  <g stroke-linecap="round" stroke-width="8">
    <path d="M497 177h42" stroke="#527aa3"/><path d="M497 199h27" stroke="#5c8a72"/><path d="M497 221h52" stroke="#c28a2c"/>
  </g>

  <path d="M570 190h38" fill="none" stroke="#738ca3" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="615" y="126" width="82" height="128" rx="14" fill="#eef3f6" stroke="#527aa3" stroke-width="2"/>
  </g>
  <text x="656" y="172" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">source</text>
  <text x="656" y="192" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">classifier</text>
  <text x="656" y="225" text-anchor="middle" fill="#527aa3" font-family="Georgia,serif" font-size="21" font-style="italic">1 … k</text>

  <path d="M35 345h662" stroke="#ded9cf"/>
  <g filter="url(#shadow)">
    <rect x="59" y="382" width="156" height="70" rx="14" fill="#fff" stroke="#a4553f" stroke-width="2"/>
  </g>
  <g transform="translate(86 417)" fill="none" stroke="#a4553f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-8" r="8" fill="#f4ddd7"/><path d="M-12 14c1-10 5-15 12-15s11 5 12 15"/>
  </g>
  <text x="112" y="411" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">target record</text>
  <text x="112" y="433" fill="#8a817c" font-family="Georgia,serif" font-size="16" font-style="italic">z = (x, y)</text>
  <path d="M216 417h236" fill="none" stroke="#a4553f" stroke-width="2.7" marker-end="url(#arrow-red)"/>
  <text x="334" y="401" text-anchor="middle" fill="#8a817c" font-family="Inter,Arial,sans-serif" font-size="13">query → logits → classify</text>
  <g filter="url(#shadow)"><rect x="460" y="378" width="237" height="78" rx="16" fill="#f4ddd7" stroke="#a4553f" stroke-width="2"/></g>
  <text x="578" y="409" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="15">inferred source</text>
  <text x="578" y="439" text-anchor="middle" fill="#a4553f" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">client i</text>
</svg>
