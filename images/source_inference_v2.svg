<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Source-inference attack against federated learning</title>
  <desc id="desc">Federated clients train a global model. An attacker queries it with client-labelled shadow data and a target record, then uses the logits to attribute that record to one client.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#463f3a" flood-opacity="0.12"/></filter>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#527aa3"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a4553f"/></marker>
    <marker id="grey-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#746d68"/></marker>
  </defs>

  <rect width="1200" height="675" fill="#fff"/>
  <rect x="344" y="40" width="822" height="595" rx="24" fill="#eef3f6" stroke="#bdceda" stroke-width="2"/>

  <!-- Three federated clients with private data and local models -->
  <g font-family="Inter,Arial,sans-serif" fill="#463f3a">
    <text x="166" y="54" text-anchor="middle" font-size="27" font-weight="700">Federated clients</text>

    <g transform="translate(26 91)">
      <circle cx="30" cy="26" r="18" fill="#463f3a"/><path d="M5 78c2-27 11-39 25-39s23 12 25 39Z" fill="#463f3a"/><text x="30" y="110" text-anchor="middle" font-size="22" font-weight="700">1</text>
      <g transform="translate(82 7)" filter="url(#shadow)"><ellipse cx="42" cy="14" rx="42" ry="14" fill="#dce8ef" stroke="#527aa3" stroke-width="3"/><path d="M0 14v55c0 8 19 14 42 14s42-6 42-14V14" fill="#dce8ef" stroke="#527aa3" stroke-width="3"/><ellipse cx="42" cy="69" rx="42" ry="14" fill="#dce8ef" stroke="#527aa3" stroke-width="3"/></g>
      <path d="M171 48h35" stroke="#746d68" stroke-width="3" marker-end="url(#grey-arrow)"/>
      <g transform="translate(213 6)" filter="url(#shadow)"><path d="M42 0 80 22v44L42 88 4 66V22Z" fill="#fff" stroke="#527aa3" stroke-width="3"/><g fill="#527aa3"><circle cx="24" cy="34" r="5"/><circle cx="24" cy="55" r="5"/><circle cx="43" cy="24" r="5"/><circle cx="43" cy="44" r="5"/><circle cx="43" cy="64" r="5"/><circle cx="62" cy="34" r="5"/><circle cx="62" cy="55" r="5"/></g><path d="M29 33 38 25M29 35l9 8M29 54l9-9M29 56l9 7M48 25l9 8M48 43l9-8M48 45l9 9M48 63l9-7" fill="none" stroke="#527aa3" stroke-width="2"/></g>
    </g>

    <g transform="translate(26 276)">
      <circle cx="30" cy="26" r="18" fill="#463f3a"/><path d="M5 78c2-27 11-39 25-39s23 12 25 39Z" fill="#463f3a"/><text x="30" y="110" text-anchor="middle" font-size="22" font-weight="700">2</text>
      <g transform="translate(82 7)" filter="url(#shadow)"><ellipse cx="42" cy="14" rx="42" ry="14" fill="#e2ece4" stroke="#5c8a72" stroke-width="3"/><path d="M0 14v55c0 8 19 14 42 14s42-6 42-14V14" fill="#e2ece4" stroke="#5c8a72" stroke-width="3"/><ellipse cx="42" cy="69" rx="42" ry="14" fill="#e2ece4" stroke="#5c8a72" stroke-width="3"/></g>
      <path d="M171 48h35" stroke="#746d68" stroke-width="3" marker-end="url(#grey-arrow)"/>
      <g transform="translate(213 6)" filter="url(#shadow)"><path d="M42 0 80 22v44L42 88 4 66V22Z" fill="#fff" stroke="#5c8a72" stroke-width="3"/><g fill="#5c8a72"><circle cx="24" cy="34" r="5"/><circle cx="24" cy="55" r="5"/><circle cx="43" cy="24" r="5"/><circle cx="43" cy="44" r="5"/><circle cx="43" cy="64" r="5"/><circle cx="62" cy="34" r="5"/><circle cx="62" cy="55" r="5"/></g><path d="M29 33 38 25M29 35l9 8M29 54l9-9M29 56l9 7M48 25l9 8M48 43l9-8M48 45l9 9M48 63l9-7" fill="none" stroke="#5c8a72" stroke-width="2"/></g>
    </g>

    <g transform="translate(26 461)">
      <circle cx="30" cy="26" r="18" fill="#463f3a"/><path d="M5 78c2-27 11-39 25-39s23 12 25 39Z" fill="#463f3a"/><text x="30" y="110" text-anchor="middle" font-size="22" font-weight="700">k</text>
      <g transform="translate(82 7)" filter="url(#shadow)"><ellipse cx="42" cy="14" rx="42" ry="14" fill="#f7ecd4" stroke="#c28a2c" stroke-width="3"/><path d="M0 14v55c0 8 19 14 42 14s42-6 42-14V14" fill="#f7ecd4" stroke="#c28a2c" stroke-width="3"/><ellipse cx="42" cy="69" rx="42" ry="14" fill="#f7ecd4" stroke="#c28a2c" stroke-width="3"/></g>
      <path d="M171 48h35" stroke="#746d68" stroke-width="3" marker-end="url(#grey-arrow)"/>
      <g transform="translate(213 6)" filter="url(#shadow)"><path d="M42 0 80 22v44L42 88 4 66V22Z" fill="#fff" stroke="#c28a2c" stroke-width="3"/><g fill="#c28a2c"><circle cx="24" cy="34" r="5"/><circle cx="24" cy="55" r="5"/><circle cx="43" cy="24" r="5"/><circle cx="43" cy="44" r="5"/><circle cx="43" cy="64" r="5"/><circle cx="62" cy="34" r="5"/><circle cx="62" cy="55" r="5"/></g><path d="M29 33 38 25M29 35l9 8M29 54l9-9M29 56l9 7M48 25l9 8M48 43l9-8M48 45l9 9M48 63l9-7" fill="none" stroke="#c28a2c" stroke-width="2"/></g>
    </g>
  </g>

  <!-- Local updates pass through the shuffling defence -->
  <g fill="none" stroke="#527aa3" stroke-width="4" marker-end="url(#blue-arrow)"><path d="M319 141C385 141 374 251 399 286"/><path d="M319 326h77"/><path d="M319 511C385 511 374 401 399 366"/></g>
  <g transform="translate(396 282)" filter="url(#shadow)">
    <circle cx="40" cy="44" r="42" fill="#fff" stroke="#527aa3" stroke-width="3"/>
    <g fill="none" stroke="#527aa3" stroke-width="4" stroke-linecap="round">
      <path d="M18 27h15c17 0 20 34 35 34h2"/>
      <path d="M18 61h15c17 0 20-34 35-34h2"/>
    </g>
    <path d="M66 20 76 27 66 34M66 54l10 7-10 7" fill="none" stroke="#527aa3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="105" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">shuffle</text>
  </g>
  <path d="M479 326h54" fill="none" stroke="#527aa3" stroke-width="4" marker-end="url(#blue-arrow)"/>

  <!-- Attack question and target record -->
  <text x="755" y="86" text-anchor="middle" fill="#463f3a" font-family="Georgia,serif" font-size="31" font-weight="700">Which client contributed the record?</text>
  <g transform="translate(390 118)" filter="url(#shadow)"><rect width="116" height="116" rx="15" fill="#fff" stroke="#a4553f" stroke-width="3"/><rect x="17" y="16" width="82" height="62" rx="8" fill="#f4ddd7"/><text x="58" y="65" text-anchor="middle" fill="#a4553f" font-family="Georgia,serif" font-size="49" font-style="italic">z</text><text x="58" y="102" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">target record</text></g>
  <path d="M480 239C494 274 510 291 534 304" fill="none" stroke="#a4553f" stroke-width="4" marker-end="url(#red-arrow)"/>

  <!-- Shared global model -->
  <g transform="translate(545 244)" filter="url(#shadow)"><path d="M24 130C6 130 0 117 0 102c0-18 13-31 31-32 5-31 29-50 59-50 27 0 49 15 58 39 4-1 8-2 13-2 25 0 45 20 45 45 0 16-8 28-21 36Z" fill="#fff" stroke="#527aa3" stroke-width="4"/><g transform="translate(54 46)" fill="none" stroke="#527aa3" stroke-width="3" stroke-linecap="round"><circle cx="0" cy="28" r="9" fill="#dce8ef"/><circle cx="42" cy="6" r="9" fill="#dce8ef"/><circle cx="42" cy="50" r="9" fill="#dce8ef"/><circle cx="88" cy="28" r="9" fill="#dce8ef"/><path d="M9 25 33 10M9 31l24 15M51 9l28 15M51 47l28-15"/></g><text x="103" y="158" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">global model</text></g>

  <!-- Client-labelled shadow records -->
  <g transform="translate(388 436)" font-family="Inter,Arial,sans-serif"><text x="68" y="0" text-anchor="middle" fill="#463f3a" font-size="22" font-weight="700">shadow data</text>
    <g transform="translate(0 18)" filter="url(#shadow)"><rect width="76" height="72" rx="10" fill="#fff" stroke="#527aa3" stroke-width="3"/><circle cx="23" cy="26" r="10" fill="#dce8ef" stroke="#527aa3" stroke-width="2"/><path d="M10 56c2-14 6-20 13-20s11 6 13 20" fill="#dce8ef" stroke="#527aa3" stroke-width="2"/><text x="56" y="46" text-anchor="middle" fill="#527aa3" font-size="24" font-weight="800">1</text></g>
    <g transform="translate(52 45)" filter="url(#shadow)"><rect width="76" height="72" rx="10" fill="#fff" stroke="#5c8a72" stroke-width="3"/><circle cx="23" cy="26" r="10" fill="#e2ece4" stroke="#5c8a72" stroke-width="2"/><path d="M10 56c2-14 6-20 13-20s11 6 13 20" fill="#e2ece4" stroke="#5c8a72" stroke-width="2"/><text x="56" y="46" text-anchor="middle" fill="#5c8a72" font-size="24" font-weight="800">2</text></g>
    <g transform="translate(104 72)" filter="url(#shadow)"><rect width="76" height="72" rx="10" fill="#fff" stroke="#c28a2c" stroke-width="3"/><circle cx="23" cy="26" r="10" fill="#f7ecd4" stroke="#c28a2c" stroke-width="2"/><path d="M10 56c2-14 6-20 13-20s11 6 13 20" fill="#f7ecd4" stroke="#c28a2c" stroke-width="2"/><text x="56" y="46" text-anchor="middle" fill="#c28a2c" font-size="24" font-weight="800">k</text></g>
  </g>
  <path d="M564 533C610 504 632 454 637 408" fill="none" stroke="#527aa3" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#blue-arrow)"/>

  <!-- Logits -->
  <path d="M751 326h47" fill="none" stroke="#746d68" stroke-width="4" marker-end="url(#grey-arrow)"/>
  <g transform="translate(812 260)" filter="url(#shadow)"><rect width="112" height="132" rx="15" fill="#fff" stroke="#8fa8ba" stroke-width="3"/><text x="56" y="29" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">logits</text><path d="M22 61h57" stroke="#527aa3" stroke-width="12" stroke-linecap="round"/><path d="M22 88h35" stroke="#5c8a72" stroke-width="12" stroke-linecap="round"/><path d="M22 115h70" stroke="#c28a2c" stroke-width="12" stroke-linecap="round"/></g>

  <!-- Source classifier -->
  <path d="M925 326h36" fill="none" stroke="#746d68" stroke-width="4" marker-end="url(#grey-arrow)"/>
  <g transform="translate(974 246)" filter="url(#shadow)"><rect width="126" height="160" rx="18" fill="#fff" stroke="#a4553f" stroke-width="3"/><g transform="translate(25 20)" fill="none" stroke="#a4553f" stroke-width="2.7"><circle cx="0" cy="18" r="6" fill="#f4ddd7"/><circle cx="0" cy="48" r="6" fill="#f4ddd7"/><circle cx="0" cy="78" r="6" fill="#f4ddd7"/><circle cx="37" cy="8" r="6" fill="#f4ddd7"/><circle cx="37" cy="38" r="6" fill="#f4ddd7"/><circle cx="37" cy="68" r="6" fill="#f4ddd7"/><circle cx="37" cy="98" r="6" fill="#f4ddd7"/><circle cx="74" cy="34" r="6" fill="#f4ddd7"/><circle cx="74" cy="70" r="6" fill="#f4ddd7"/><path d="M6 17 31 9M6 20l25 17M6 46l25-8M6 50l25 17M6 76l25-8M43 10l25 21M43 38l25-3M43 40l25 27M43 68l25-31M43 70l25-1M43 96l25-23" opacity="0.75"/></g><text x="63" y="133" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">source</text><text x="63" y="153" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">classifier</text></g>

  <!-- Source attribution -->
  <path d="M1101 326h31" fill="none" stroke="#a4553f" stroke-width="4" marker-end="url(#red-arrow)"/>
  <g transform="translate(1138 220)"><g fill="#746d68"><circle cx="15" cy="15" r="12"/><path d="M-2 58c2-21 7-30 17-30s15 9 17 30Z"/></g><g transform="translate(0 78)"><circle cx="15" cy="15" r="20" fill="#f4ddd7" stroke="#a4553f" stroke-width="4"/><path d="M-10 63c2-25 10-36 25-36s23 11 25 36Z" fill="#a4553f"/><circle cx="15" cy="15" r="12" fill="#a4553f"/><text x="15" y="55" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">2</text></g><g transform="translate(0 196)" fill="#746d68"><circle cx="15" cy="15" r="12"/><path d="M-2 58c2-21 7-30 17-30s15 9 17 30Z"/></g></g>
</svg>
