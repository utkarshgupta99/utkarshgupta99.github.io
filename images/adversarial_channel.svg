<svg xmlns="http://www.w3.org/2000/svg" width="730" height="498" viewBox="0 0 730 498" role="img" aria-labelledby="title desc">
  <title id="title">Over-the-air adversarial attack on deep-learning channel estimation</title>
  <desc id="desc">A transmitter sends a pilot signal while an attacker injects a power-constrained perturbation over the air, causing a deep-learning receiver to produce an incorrect channel estimate.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#463f3a" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#527aa3"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a4553f"/></marker>
  </defs>
  <rect width="730" height="498" rx="18" fill="#fbfaf6"/>

  <!-- Transmitter -->
  <g transform="translate(92 215)" fill="none" stroke="#463f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0-72v141M-34 69H34M0-56L-34 69M0-56L34 69M-24 34h48M-16 5h32"/>
    <path d="M-19-77c-17 17-17 37 0 54M19-77c17 17 17 37 0 54" stroke="#527aa3"/>
    <path d="M-33-91c-26 25-26 57 0 82M33-91c26 25 26 57 0 82" stroke="#527aa3"/>
  </g>
  <text x="92" y="313" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="650">transmitter</text>
  <text x="92" y="335" text-anchor="middle" fill="#8a817c" font-family="Inter,Arial,sans-serif" font-size="13">known pilot</text>

  <!-- Pilot and attacked signal -->
  <path d="M144 177h38c12-34 24 34 36 0s24 34 36 0 24 34 36 0h35" fill="none" stroke="#527aa3" stroke-width="3" stroke-linecap="round"/>
  <text x="234" y="145" text-anchor="middle" fill="#527aa3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">pilot signal</text>
  <path d="M294 177h61" stroke="#527aa3" stroke-width="2.7" marker-end="url(#arrow)"/>

  <!-- Attacker -->
  <g filter="url(#shadow)"><rect x="178" y="352" width="211" height="98" rx="16" fill="#fff" stroke="#a4553f" stroke-width="2"/></g>
  <g transform="translate(216 400)" fill="none" stroke="#a4553f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-18 8h36l-4 15h-28Z" fill="#f4ddd7"/><path d="M-13 8c1-18 7-29 13-29S12-10 13 8"/>
    <circle cx="-5" cy="-3" r="2" fill="#a4553f"/><circle cx="5" cy="-3" r="2" fill="#a4553f"/>
  </g>
  <text x="252" y="392" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650">over-the-air attacker</text>
  <text x="252" y="416" fill="#8a817c" font-family="Inter,Arial,sans-serif" font-size="13">power-constrained perturbation</text>
  <path d="M330 352c7-37 3-72 17-104" fill="none" stroke="#a4553f" stroke-width="2.7" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
  <path d="M205 333c9-16 18 16 27 0s18 16 27 0 18 16 27 0 18 16 27 0" fill="none" stroke="#a4553f" stroke-width="2.3"/>

  <!-- Receiver / model -->
  <g filter="url(#shadow)"><rect x="366" y="109" width="181" height="188" rx="20" fill="#fff" stroke="#d9d4ca" stroke-width="2"/></g>
  <text x="456" y="143" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">DL channel estimator</text>
  <text x="456" y="165" text-anchor="middle" fill="#8a817c" font-family="Inter,Arial,sans-serif" font-size="13">received pilot + perturbation</text>
  <g transform="translate(400 210)" fill="none" stroke="#527aa3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="8" fill="#dce8ef"/><circle cx="38" cy="-28" r="8" fill="#dce8ef"/><circle cx="38" cy="0" r="8" fill="#dce8ef"/><circle cx="38" cy="28" r="8" fill="#dce8ef"/><circle cx="82" cy="0" r="8" fill="#dce8ef"/>
    <path d="M8-2l22-22M8 0h22M8 2l22 22M46-26l28 22M46 0h28M46 26L74 4"/>
  </g>
  <path d="M548 203h41" stroke="#738ca3" stroke-width="2.7" marker-end="url(#arrow)"/>

  <!-- Corrupted estimate -->
  <g filter="url(#shadow)"><rect x="596" y="109" width="101" height="188" rx="18" fill="#fff" stroke="#a4553f" stroke-width="2"/></g>
  <text x="646" y="143" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">channel</text>
  <text x="646" y="162" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">estimate</text>
  <g transform="translate(618 185)">
    <rect width="18" height="18" fill="#527aa3"/><rect x="20" width="18" height="18" fill="#d8a041"/><rect x="40" width="18" height="18" fill="#a4553f"/>
    <rect y="20" width="18" height="18" fill="#d8a041"/><rect x="20" y="20" width="18" height="18" fill="#a4553f"/><rect x="40" y="20" width="18" height="18" fill="#527aa3"/>
    <rect y="40" width="18" height="18" fill="#a4553f"/><rect x="20" y="40" width="18" height="18" fill="#527aa3"/><rect x="40" y="40" width="18" height="18" fill="#d8a041"/>
    <rect y="60" width="18" height="18" fill="#7a6987"/><rect x="20" y="60" width="18" height="18" fill="#a4553f"/><rect x="40" y="60" width="18" height="18" fill="#5c8a72"/>
  </g>
  <path d="M610 272l72-72M682 272l-72-72" stroke="#a4553f" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <text x="646" y="322" text-anchor="middle" fill="#a4553f" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">estimation error ↑</text>

  <path d="M421 355h276" stroke="#ded9cf"/>
  <text x="559" y="388" text-anchor="middle" fill="#463f3a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650">attacks evaluated against</text>
  <g font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">
    <rect x="424" y="405" width="126" height="36" rx="18" fill="#edf2ec" stroke="#5c8a72"/><text x="487" y="428" fill="#5c8a72">adversarial training</text>
    <rect x="561" y="405" width="136" height="36" rx="18" fill="#eee9f2" stroke="#7a6987"/><text x="629" y="428" fill="#7a6987">defensive distillation</text>
  </g>
</svg>
